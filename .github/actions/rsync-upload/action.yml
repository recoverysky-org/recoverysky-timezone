name: "Rsync Upload to rsync.net"
description: "Setup SSH and upload files to rsync.net using rsync"
inputs:
  src:
    description: "Source directory to sync (e.g., src/scripts/)"
    required: true
  dest:
    description: "Destination path on rsync.net (e.g., recoverysky/scripts/)"
    required: true
  delete_extra:
    description: "Delete files in destination that are not in source (default: false for safety)"
    required: false
    default: "false"
  rsync_host:
    description: "rsync.net hostname"
    required: true
  rsync_user:
    description: "rsync.net username"
    required: true
  ssh_private_key:
    description: "SSH private key for rsync.net"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup SSH Key for rsync.net
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_private_key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan ${{ inputs.rsync_host }} >> ~/.ssh/known_hosts

    - name: Upload to rsync.net
      shell: bash
      run: |
        rsync -avz --times \
          --exclude='._*' \
          --exclude='.DS_Store' \
          --exclude='.Spotlight-V100' \
          --exclude='.Trashes' \
          --exclude='.fseventsd' \
          --exclude='.TemporaryItems' \
          --exclude='.VolumeIcon.icns' \
          --exclude='__MACOSX' \
          --mkpath \
          ${{ inputs.src }} \
          ${{ inputs.rsync_user }}@${{ inputs.rsync_host }}:${{ inputs.dest }}
        echo "✅ Files synced from ${{ inputs.src }} to rsync.net:${{ inputs.dest }} (delete_extra: ${{ inputs.delete_extra }})"
